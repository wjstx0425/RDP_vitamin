[project]
name = "vb3-robot-server"
version = "0.1.0"
description = "Robot-side runtime for VB3 bimanual SmolVLA deployment"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
dependencies = [
    "atomics>=1.0,<2.0",
    "av==15.1.0",
    "click>=8.1,<9.0",
    "kaleido>=1.0,<2.0",
    "msgpack>=1.0,<2.0",
    "numpy>=1.26,<2.0",
    "opencv-python>=4.11,<4.12",
    "pillow>=11.0,<12.0",
    "plotly>=6.0,<7.0",
    "pykin==1.6.0",
    "pyudev>=0.24,<0.25",
    "pyyaml>=6.0,<7.0",
    "requests>=2.32,<3.0",
    "scipy>=1.15,<2.0",
    "threadpoolctl>=3.6,<4.0",
    "transforms3d>=0.4,<0.5",
    "v4l2-python3==0.3.5",
    "websockets>=15.0,<17.0",
]

[dependency-groups]
dev = ["pytest>=8.3,<9.0"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.isort]
force-single-line = true
force-sort-within-sections = true
single-line-exclusions = ["collections.abc", "typing", "typing_extensions"]

[tool.pytest.ini_options]
markers = ["manual: should be run manually."]
pythonpath = ["."]
testpaths = ["tests", "deploy_scripts"]
