horizon: 20
n_obs_steps: 1
dataset_obs_temporal_downsample_ratio: 1

policy:
  horizon: ${horizon}
  n_latent_dims: 32
  mlp_layer_num: 1
  use_conv_encoder: true
  conv_latent_dims: 32
  conv_layer_num: 1
  use_rnn_decoder: true
  rnn_latent_dims: 256
  rnn_layer_num: 1
  kl_multiplier: 1.0e-6
  n_embed: 16
  use_vq: false
  vqvae_groups: 4
  eval: false
  act_scale: 1
